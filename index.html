<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mã 2FA Của Tôi</title>
    <!-- Thư viện tạo mã TOTP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otplib/12.0.1/otplib-browser.js"></script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">

    <h2>Mã xác thực 2FA của bạn là:</h2>
    <h1 id="otp-code" style="color: blue; font-size: 48px; letter-spacing: 5px;">Đang tải...</h1>
    <p>Mã sẽ tự động làm mới sau mỗi 30 giây.</p>

    <script>
        // Lấy mã secret từ trên đường link URL
        const urlParams = new URLSearchParams(window.location.search);
        let secret = urlParams.get('secret');

        if (secret) {
            // Xóa các khoảng trắng nếu có
            secret = secret.replace(/\s+/g, '').toUpperCase();
            
            function updateOTP() {
                try {
                    // Tạo mã 6 số
                    const token = otplib.authenticator.generate(secret);
                    document.getElementById('otp-code').style.fontSize = "48px";
                    document.getElementById('otp-code').innerText = token;
                } catch (error) {
                    // Hiển thị chính xác lỗi gì đang xảy ra thay vì báo chung chung
                    document.getElementById('otp-code').style.fontSize = "20px";
                    document.getElementById('otp-code').style.color = "red";
                    document.getElementById('otp-code').innerText = "Chi tiết lỗi: " + error.message;
                }
            }

            // Chạy ngay lần đầu và cập nhật liên tục mỗi 1 giây
            updateOTP();
            setInterval(updateOTP, 1000);
        } else {
            document.getElementById('otp-code').style.fontSize = "24px";
            document.getElementById('otp-code').innerText = "Vui lòng nhập ?secret=... vào URL";
        }
    </script>
</body>
</html>
